[build]
  command = "npm run build"
  publish = "dist"

# Proxy API vers le backend Render (doit être AVANT le catch-all SPA)
[[redirects]]
  from = "/api/*"
  to = "https://e-qos-web-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Services retirés (Odoo, paiements locaux) : redirection permanente
[[redirects]]
  from = "/services/odoo"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/erp"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/paiements-locaux"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/paiements"
  to = "/services"
  status = 301

# SPA fallback — React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
